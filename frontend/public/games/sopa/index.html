<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Sopa de letras 16×16 (robusta 15 palabras)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .cell-selected { background: rgba(0, 204, 153, 0.25); }
    .cell-found { background: rgba(16,185,129,1); color: white; font-weight: 700; }
    .word-found { text-decoration: line-through; color: #10b981; font-weight: 600; }
    .noselect { -webkit-user-select: none; -ms-user-select: none; user-select: none; }
    #board-wrapper { width: 100%; max-width: 820px; position: relative; }
    #board {
      display: grid;
      grid-template-columns: repeat(16, minmax(2rem, 1fr));
      gap: .35rem;
      width: 100%;
    }
    .board-cell { aspect-ratio: 1 / 1; }
    #linesSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col">
  <audio id="successSound" src="c-371145.mp3" preload="auto"></audio>

  <header class="w-full bg-slate-950/50 border-b border-white/5">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <div>
        <h1 class="text-xl md:text-2xl font-semibold">Fase 1 – Sopa de letras</h1>
        <p class="text-sm text-slate-200/70">16×16 · sin scroll · bloqueo duplicados · TODAS las palabras</p>
      </div>
      <div class="text-right">
        <p class="text-[0.6rem] uppercase text-slate-200/40">tiempo</p>
        <p id="timer" class="text-3xl font-mono text-emerald-300">00:00</p>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6 space-y-6">
    <div class="grid lg:grid-cols-[1.2fr_0.8fr] gap-6 items-start">
      <div class="bg-slate-900/40 border border-white/5 rounded-3xl p-4 md:p-6 relative">
        <div id="board-wrapper">
          <svg id="linesSvg"></svg>
          <div id="board" class="noselect"></div>
        </div>
        <div id="doneMessage" class="hidden mt-6 bg-emerald-400/10 border border-emerald-400/40 text-emerald-50 rounded-2xl px-4 py-3 flex items-center gap-3">
          <span class="text-2xl">🎉</span>
          <div>
            <p class="font-semibold">¡Listo! Equipo completó la sopa</p>
            <p class="text-sm text-emerald-50/80">Comparte el tiempo con el facilitador.</p>
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <div class="bg-slate-900/40 border border-white/5 rounded-3xl p-4">
          <p class="text-[0.6rem] uppercase text-slate-200/40 mb-1">equipo</p>
          <input value="Equipo 1 - Naranja" class="w-full bg-slate-950/20 border border-white/10 rounded-2xl px-3 py-2 text-sm" />
        </div>
        <div class="bg-slate-900/40 border border-white/5 rounded-3xl p-4 max-h-[430px] overflow-y-auto">
          <h2 class="text-xs uppercase text-slate-200/60 mb-3">Palabras (15)</h2>
          <ul id="wordList" class="grid grid-cols-2 gap-2 text-sm"></ul>
        </div>
        <div class="bg-slate-900/40 border border-white/5 rounded-3xl p-4 flex gap-3">
          <button id="resetBtn" class="flex-1 bg-slate-950/40 rounded-2xl py-2">Reiniciar</button>
          <button id="mixBtn" class="flex-1 bg-emerald-400/80 text-slate-950 rounded-2xl py-2 font-semibold">Nueva sopa</button>
        </div>
      </div>
    </div>
  </main>

<script>
const GRID_SIZE = 16;
const WORDS = [
  "INNOVACION","EQUIPO","IDEA","CREATIVIDAD","PITCH",
  "EMPATIA","LIDERAZGO","PROYECTO","STARTUP","DESAFIO",
  "SOLUCION","CLIENTE","IMPACTO","TECNOLOGIA","COLABORAR"
];
const WORD_COLORS = [
  "rgba(16,185,129,0.45)","rgba(59,130,246,0.45)","rgba(236,72,153,0.45)",
  "rgba(244,63,94,0.45)","rgba(234,179,8,0.45)","rgba(14,165,233,0.45)",
  "rgba(147,51,234,0.45)","rgba(34,197,235,0.45)","rgba(94,234,212,0.45)",
  "rgba(251,191,36,0.45)","rgba(250,113,131,0.45)","rgba(45,212,191,0.45)",
  "rgba(59,130,246,0.45)","rgba(236,72,153,0.45)","rgba(16,185,129,0.45)"
];

const boardEl = document.getElementById("board");
const linesSvg = document.getElementById("linesSvg");
const wordListEl = document.getElementById("wordList");
const timerEl = document.getElementById("timer");
const doneMessageEl = document.getElementById("doneMessage");
const resetBtn = document.getElementById("resetBtn");
const mixBtn = document.getElementById("mixBtn");
const successSound = document.getElementById("successSound");

let grid = [];
let isSelecting = false;
let selectedCells = [];
let dir = null;
let foundWords = new Set();
let seconds = 0;
let timerInterval = null;
let liveLine = null;

function startTimer(){
  if (timerInterval) return;
  timerInterval = setInterval(()=>{
    seconds++;
    const mm = String(Math.floor(seconds/60)).padStart(2,"0");
    const ss = String(seconds%60).padStart(2,"0");
    timerEl.textContent = mm+":"+ss;
  },1000);
}
function resetTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  seconds = 0;
  timerEl.textContent = "00:00";
}

// ---------- grid robusto ----------
function createEmptyGrid(){
  grid = Array.from({length: GRID_SIZE}, ()=>Array(GRID_SIZE).fill(""));
}
function canPlace(word,row,col,dr,dc){
  for (let i=0;i<word.length;i++){
    const r = row + dr*i;
    const c = col + dc*i;
    if (r<0 || r>=GRID_SIZE || c<0 || c>=GRID_SIZE) return false;
    const cell = grid[r][c];
    if (cell !== "" && cell !== word[i]) return false;
  }
  return true;
}
function placeWord(word){
  const dirs = [
    {dr:0,dc:1},{dr:0,dc:-1},
    {dr:1,dc:0},{dr:-1,dc:0},
    {dr:1,dc:1},{dr:1,dc:-1},
    {dr:-1,dc:1},{dr:-1,dc:-1},
  ];
  // probamos posiciones aleatorias
  for (let attempt=0; attempt<300; attempt++){
    const d = dirs[Math.floor(Math.random()*dirs.length)];
    const row = Math.floor(Math.random()*GRID_SIZE);
    const col = Math.floor(Math.random()*GRID_SIZE);
    if (canPlace(word,row,col,d.dr,d.dc)){
      for (let i=0;i<word.length;i++){
        grid[row + d.dr*i][col + d.dc*i] = word[i];
      }
      return true;
    }
  }
  return false;
}
function buildGrid(){
  // intentamos varias veces construir TODO el tablero
  for (let tries=0; tries<80; tries++){
    createEmptyGrid();
    let okAll = true;
    for (const w of WORDS){
      if (!placeWord(w)){
        okAll = false;
        break;
      }
    }
    if (okAll){
      // rellenar vacíos
      const letters = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
      for (let r=0;r<GRID_SIZE;r++){
        for (let c=0;c<GRID_SIZE;c++){
          if (grid[r][c]==="") grid[r][c] = letters[Math.floor(Math.random()*letters.length)];
        }
      }
      return;
    }
  }
  // si después de muchos intentos no logramos 15, quitamos la última
  console.warn("No cupieron las 15, quitando la última solo en este intento.");
  const reduced = WORDS.slice(0,14);
  createEmptyGrid();
  for (const w of reduced) placeWord(w);
  const letters = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
  for (let r=0;r<GRID_SIZE;r++){
    for (let c=0;c<GRID_SIZE;c++){
      if (grid[r][c]==="") grid[r][c] = letters[Math.floor(Math.random()*letters.length)];
    }
  }
}

function renderBoard(){
  boardEl.innerHTML = "";
  linesSvg.innerHTML = "";
  for (let r=0;r<GRID_SIZE;r++){
    for (let c=0;c<GRID_SIZE;c++){
      const cell = document.createElement("div");
      cell.textContent = grid[r][c];
      cell.className = "board-cell flex items-center justify-center bg-slate-900/40 hover:bg-emerald-400/15 rounded-xl font-semibold text-white cursor-pointer";
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.addEventListener("mousedown", startSelection);
      cell.addEventListener("mouseenter", moveSelection);
      cell.addEventListener("mouseup", endSelection);
      boardEl.appendChild(cell);
    }
  }
  requestAnimationFrame(()=>{
    const rect = boardEl.getBoundingClientRect();
    linesSvg.setAttribute("width", rect.width);
    linesSvg.setAttribute("height", rect.height);
    linesSvg.setAttribute("viewBox",`0 0 ${rect.width} ${rect.height}`);
  });
}

function renderWordList(){
  wordListEl.innerHTML = "";
  WORDS.forEach((w,i)=>{
    const li = document.createElement("li");
    li.textContent = w;
    li.dataset.word = w;
    li.className = "px-3 py-1 bg-slate-950/40 rounded-2xl border border-white/5 flex items-center gap-2";
    const dot = document.createElement("span");
    dot.className = "w-2 h-2 rounded-full";
    dot.style.background = WORD_COLORS[i%WORD_COLORS.length].replace("0.45","1");
    li.prepend(dot);
    wordListEl.appendChild(li);
  });
}

function getCellFromPoint(x,y){
  const rect = boardEl.getBoundingClientRect();
  if (x<rect.left || x>rect.right || y<rect.top || y>rect.bottom) return null;
  const col = Math.floor((x-rect.left)/(rect.width/GRID_SIZE));
  const row = Math.floor((y-rect.top)/(rect.height/GRID_SIZE));
  if (row<0||row>=GRID_SIZE||col<0||col>=GRID_SIZE) return null;
  return boardEl.children[row*GRID_SIZE+col];
}

function startSelection(e){
  e.preventDefault();
  isSelecting = true;
  startTimer();
  clearSelection();
  selectedCells = [];
  dir = null;
  addCell(e.target);
  createLiveLine();
}
function moveSelection(e){
  if (!isSelecting) return;
  addCell(e.target);
  updateLiveLine();
}
document.addEventListener("touchmove",(e)=>{
  if (!isSelecting) return;
  const t = e.touches[0];
  const cell = getCellFromPoint(t.clientX,t.clientY);
  if (cell){
    addCell(cell);
    updateLiveLine();
  }
  e.preventDefault();
},{passive:false});
function endSelection(){
  if (!isSelecting) return;
  isSelecting = false;
  checkWord();
}
document.addEventListener("mouseup",()=>{ if (isSelecting){ isSelecting=false; checkWord(); }});
document.addEventListener("touchend",()=>{ if (isSelecting){ isSelecting=false; checkWord(); }});

function addCell(cell){
  const row = parseInt(cell.dataset.row);
  const col = parseInt(cell.dataset.col);
  const key = row+"-"+col;
  if (selectedCells.find(c=>c.key===key)) return;

  if (selectedCells.length===0){
    selectedCells.push({row,col,key,el:cell});
    cell.classList.add("cell-selected");
    return;
  }
  if (selectedCells.length===1){
    const prev = selectedCells[0];
    const dr = Math.sign(row - prev.row);
    const dc = Math.sign(col - prev.col);
    if (dr===0 && dc===0) return;
    dir = {dr,dc};
    selectedCells.push({row,col,key,el:cell});
    cell.classList.add("cell-selected");
    return;
  }
  const last = selectedCells[selectedCells.length-1];
  const expectedRow = last.row + dir.dr;
  const expectedCol = last.col + dir.dc;
  if (row===expectedRow && col===expectedCol){
    selectedCells.push({row,col,key,el:cell});
    cell.classList.add("cell-selected");
  }
}

function getBoardRect(){ return boardEl.getBoundingClientRect(); }
function getCellCenter(c){
  const br = getBoardRect();
  const r = c.el.getBoundingClientRect();
  return { x: r.left - br.left + r.width/2, y: r.top - br.top + r.height/2 };
}
function createLiveLine(){
  liveLine = document.createElementNS("http://www.w3.org/2000/svg","line");
  liveLine.setAttribute("stroke","rgba(148,163,184,0.25)");
  liveLine.setAttribute("stroke-width","12");
  liveLine.setAttribute("stroke-linecap","round");
  linesSvg.appendChild(liveLine);
  updateLiveLine();
}
function updateLiveLine(){
  if (!liveLine || selectedCells.length===0) return;
  const start = getCellCenter(selectedCells[0]);
  const end = getCellCenter(selectedCells[selectedCells.length-1]);
  liveLine.setAttribute("x1", start.x);
  liveLine.setAttribute("y1", start.y);
  liveLine.setAttribute("x2", end.x);
  liveLine.setAttribute("y2", end.y);
}
function createFinalLine(cells,color){
  const start = getCellCenter(cells[0]);
  const end = getCellCenter(cells[cells.length-1]);
  const line = document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1", start.x);
  line.setAttribute("y1", start.y);
  line.setAttribute("x2", end.x);
  line.setAttribute("y2", end.y);
  line.setAttribute("stroke", color);
  line.setAttribute("stroke-width","18");
  line.setAttribute("stroke-linecap","round");
  linesSvg.appendChild(line);
}

function checkWord(){
  if (selectedCells.length<=1){
    clearSelection();
    if (liveLine){ linesSvg.removeChild(liveLine); liveLine=null; }
    return;
  }
  const letters = selectedCells.map(c=>grid[c.row][c.col]).join("");
  const reversed = letters.split("").reverse().join("");
  const idx = WORDS.findIndex(w => w===letters || w===reversed);
  if (idx !== -1){
    const word = WORDS[idx];
    if (foundWords.has(word)){
      clearSelection();
      if (liveLine){ linesSvg.removeChild(liveLine); liveLine=null; }
      selectedCells=[]; dir=null; return;
    }
    selectedCells.forEach(c=>{
      c.el.classList.remove("cell-selected");
      c.el.classList.add("cell-found");
    });
    foundWords.add(word);
    const li = wordListEl.querySelector(`[data-word="${word}"]`);
    if (li) li.classList.add("word-found");
    if (liveLine){ linesSvg.removeChild(liveLine); liveLine=null; }
    createFinalLine(selectedCells, WORD_COLORS[idx%WORD_COLORS.length]);
    if (successSound){ successSound.currentTime=0; successSound.play().catch(()=>{}); }
    if (foundWords.size === WORDS.length){
      doneMessageEl.classList.remove("hidden");
      clearInterval(timerInterval); timerInterval=null;
    }
  } else {
    clearSelection();
    if (liveLine){ linesSvg.removeChild(liveLine); liveLine=null; }
  }
  selectedCells = [];
  dir = null;
}

function clearSelection(){
  boardEl.querySelectorAll(".cell-selected").forEach(c=>c.classList.remove("cell-selected"));
}

function buildBoard(){
  buildGrid();
  renderBoard();
  renderWordList();
  foundWords.clear();
  doneMessageEl.classList.add("hidden");
}

resetBtn.addEventListener("click", ()=>{ resetTimer(); buildBoard(); });
mixBtn.addEventListener("click", ()=>{ resetTimer(); buildBoard(); });

window.addEventListener("resize", ()=>{
  const rect = boardEl.getBoundingClientRect();
  linesSvg.setAttribute("width", rect.width);
  linesSvg.setAttribute("height", rect.height);
  linesSvg.setAttribute("viewBox",`0 0 ${rect.width} ${rect.height}`);
});

buildBoard();
</script>
</body>
</html>
