<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Fase 1 – Rompehielos (animado + sonido)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .person-card {
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .person-active {
      background: rgba(45, 212, 191, .18);
      border: 1px solid rgba(45, 212, 191, .8);
      transform: scale(1.01);
      box-shadow: 0 10px 25px rgba(45,212,191,.25);
    }
    .question-flash {
      animation: flash .25s ease-in-out 2;
    }
    @keyframes flash {
      0%,100%{background:rgba(236,253,245,0)}
      50%{background:rgba(45,212,191,.2)}
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col">
  <!-- nuevo sonido para cada paso -->
  <audio id="stepSound" src="ui-button-click-5-327756.mp3" preload="auto"></audio>

  <header class="w-full border-b border-white/5 bg-slate-950/60">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <div>
        <h1 class="text-xl md:text-2xl font-semibold">Fase 1 – Rompehielos</h1>
        <p class="text-sm text-slate-200/70">Sorteo animado de persona y pregunta.</p>
      </div>
      <div class="text-right">
        <p class="text-[0.6rem] uppercase text-slate-200/40">modo</p>
        <p class="text-sm font-medium text-emerald-300">Grupos · tablets</p>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-6 space-y-6">
    <section class="bg-slate-900/40 border border-white/5 rounded-3xl p-5 space-y-4">
      <div class="flex items-center justify-between gap-3">
        <h2 class="text-lg font-semibold">Personas del grupo</h2>
        <p id="roundLabel" class="text-xs text-slate-200/50">Ronda 1</p>
      </div>
      <div id="peopleList" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
    </section>

    <section class="bg-slate-900/40 border border-white/5 rounded-3xl p-6 space-y-5">
      <div class="flex items-center gap-3">
        <span class="inline-flex w-9 h-9 rounded-2xl bg-emerald-400/10 border border-emerald-400/60 items-center justify-center text-emerald-300 text-lg">?</span>
        <div>
          <p class="text-xs uppercase text-slate-200/40">persona elegida</p>
          <p id="currentPerson" class="text-xl font-semibold">—</p>
        </div>
      </div>

      <div>
        <p class="text-xs uppercase text-slate-200/40 mb-2">pregunta rompehielos</p>
        <p id="currentQuestion" class="text-xl md:text-2xl leading-relaxed text-slate-50/90">
          …
        </p>
      </div>

      <div class="flex flex-wrap gap-3">
        <button id="btnNewQuestion" class="px-4 py-2 rounded-2xl bg-slate-950/50 border border-white/10 hover:bg-slate-900/80 transition text-sm disabled:opacity-40 disabled:cursor-not-allowed">
          Otra pregunta 🔁
        </button>
        <button id="btnNewPerson" class="px-4 py-2 rounded-2xl bg-slate-950/50 border border-white/10 hover:bg-slate-900/80 transition text-sm disabled:opacity-40 disabled:cursor-not-allowed">
          Otra persona 🙋
        </button>
        <button id="btnNewRound" class="px-4 py-2 rounded-2xl bg-emerald-400 text-slate-950 font-semibold text-sm disabled:opacity-40 disabled:cursor-not-allowed">
          Nueva ronda ➜
        </button>
      </div>

      <p class="text-xs text-slate-200/40">
        Tip: el sonido se dispara en cada “salto” de persona/pregunta. Si te molesta mucho en tablets, baja el volumen del sistema.
      </p>
    </section>
  </main>

<script>
const PEOPLE = ["Camila","Martín","Valentina","Diego","Sofía","Javier"];
const QUESTIONS = [
  "¿Qué te motivó a entrar a este proyecto / carrera?",
  "¿Qué te gustaría que tu equipo sepa sobre ti desde hoy?",
  "¿Qué cosas haces muy bien cuando trabajas en grupo?",
  "¿Cuál ha sido tu mejor experiencia trabajando con otras personas?",
  "¿Qué tipo de tareas disfrutas más dentro de un proyecto?",
  "¿Qué te ayuda a confiar en tu equipo?",
  "¿Cuál sería tu rol ideal en esta actividad?",
  "Cuenta una habilidad tuya que el grupo todavía no conoce.",
  "¿Qué esperas aprender de tus compañeros en esta actividad?",
  "¿Qué te gusta hacer para desconectarte después de estudiar/trabajar?",
  "Si tuvieras que agradecer algo al equipo ahora, ¿qué sería?",
  "¿Qué objetivo personal tienes para este semestre/año?",
  "¿Cuál fue tu primer emprendimiento o idea loca que tuviste?"
];

const peopleListEl = document.getElementById("peopleList");
const currentPersonEl = document.getElementById("currentPerson");
const currentQuestionEl = document.getElementById("currentQuestion");
const roundLabelEl = document.getElementById("roundLabel");
const btnNewQuestion = document.getElementById("btnNewQuestion");
const btnNewPerson = document.getElementById("btnNewPerson");
const btnNewRound = document.getElementById("btnNewRound");
const stepSound = document.getElementById("stepSound");

let round = 1;
let lastPerson = null;
let lastQuestion = null;
let isAnimating = false;

function playStep(){
  if (!stepSound) return;
  try{ stepSound.volume = 0.35; }catch(e){}
  try{ stepSound.currentTime = 0; }catch(e){}
  stepSound.play && stepSound.play().catch(()=>{});
}

function renderPeople(selectedName){
  peopleListEl.innerHTML = "";
  PEOPLE.forEach(name => {
    const card = document.createElement("div");
    const isSelected = name === selectedName;
    card.className = "person-card rounded-2xl px-4 py-3 flex items-center justify-between gap-2 " +
      (isSelected ? "person-active" : "bg-slate-950/20 border border-white/5");
    card.dataset.name = name;
    const span = document.createElement("span");
    span.textContent = name;
    span.className = "font-medium";
    card.appendChild(span);
    if (isSelected){
      const tag = document.createElement("span");
      tag.textContent = "▶";
      tag.className = "text-emerald-300 text-sm";
      card.appendChild(tag);
    }
    peopleListEl.appendChild(card);
  });
}

function lockButtons(flag){
  btnNewQuestion.disabled = flag;
  btnNewPerson.disabled = flag;
  btnNewRound.disabled = flag;
}

function getRandomDifferent(list, last){
  if (!last) return list[Math.floor(Math.random() * list.length)];
  let candidate = list[Math.floor(Math.random() * list.length)];
  if (candidate === last && list.length > 1){
    candidate = list[(list.indexOf(candidate)+1) % list.length];
  }
  return candidate;
}

function animatePick(list, lastValue, onStep, onEnd, duration=1400, interval=120){
  let elapsed = 0;
  isAnimating = true;
  lockButtons(true);
  const start = performance.now();
  const timer = setInterval(()=>{
    const now = performance.now();
    elapsed = now - start;
    const candidate = list[Math.floor(Math.random() * list.length)];
    onStep(candidate);
    playStep();
    if (elapsed >= duration){
      clearInterval(timer);
      let final = list[Math.floor(Math.random() * list.length)];
      if (final === lastValue && list.length > 1){
        final = list[(list.indexOf(final)+1) % list.length];
      }
      onEnd(final);
      isAnimating = false;
      lockButtons(false);
    }
  }, interval);
}

function animatePersonSequence(next){
  animatePick(
    PEOPLE,
    lastPerson,
    (temp)=>{
      renderPeople(temp);
      currentPersonEl.textContent = temp;
    },
    (final)=>{
      lastPerson = final;
      renderPeople(final);
      currentPersonEl.textContent = final;
      if (typeof next === "function") next();
    },
    1400,
    110
  );
}

function animateQuestionSequence(){
  animatePick(
    QUESTIONS,
    lastQuestion,
    (temp)=>{
      currentQuestionEl.textContent = temp;
    },
    (final)=>{
      lastQuestion = final;
      currentQuestionEl.textContent = final;
      currentQuestionEl.classList.remove("question-flash");
      void currentQuestionEl.offsetWidth;
      currentQuestionEl.classList.add("question-flash");
    },
    1500,
    120
  );
}

btnNewPerson.addEventListener("click", ()=>{
  if (isAnimating) return;
  animatePersonSequence();
});

btnNewQuestion.addEventListener("click", ()=>{
  if (isAnimating) return;
  animateQuestionSequence();
});

btnNewRound.addEventListener("click", ()=>{
  if (isAnimating) return;
  round++;
  roundLabelEl.textContent = "Ronda " + round;
  animatePersonSequence(()=>animateQuestionSequence());
});

// init
renderPeople(null);
currentPersonEl.textContent = "—";
currentQuestionEl.textContent = "Pulsa “Nueva ronda” para empezar.";

</script>

<script>
// ---- Ruleta SFX wrapper (no toca tu lógica) ----
(function(){
  var snd = document.getElementById('stepSound');
  if (!snd) return;
  var last = 0;
  var MIN_GAP = 320; // ms: sube para más lento, baja para más rápido
  function playClickThrottled(){
    var now = performance.now();
    if (now - last < MIN_GAP) return;
    last = now;
    try { snd.volume = 0.32; } catch(e){}
    try { snd.currentTime = 0; } catch(e){}
    if (snd.play) snd.play().catch(function(){});
  }
  // Si existe playStep original, lo envolvemos para no romper nada
  if (window.playStep && !window.__wrappedPlayStep){
    var orig = window.playStep;
    window.playStep = function(){
      try { orig.apply(this, arguments); } catch(e){}
      playClickThrottled();
    };
    window.__wrappedPlayStep = true;
  } else {
    // Si no hay playStep, exponemos una API por si lo llamas manual
    window.playStepSound = playClickThrottled;
  }
})();
</script>


<script>
// ---- Parche de animación: hace más lentos intervalos cortos (ruleta) ----
(function(){
  var FACTOR = 1.6; // sube para más lento, baja para más rápido
  var MIN = 60, MAX = 260; // sólo afecta intervalos típicos de ruleta
  var _si = window.setInterval, _st = window.setTimeout;
  window.setInterval = function(fn, delay){
    if (typeof delay === "number" && delay >= MIN && delay <= MAX) {
      delay = Math.round(delay * FACTOR);
    }
    return _si.apply(this, arguments.length > 2 ? [fn, delay].concat([].slice.call(arguments,2)) : [fn, delay]);
  };
  window.setTimeout = function(fn, delay){
    if (typeof delay === "number" && delay >= MIN && delay <= MAX) {
      delay = Math.round(delay * FACTOR);
    }
    return _st.apply(this, arguments.length > 2 ? [fn, delay].concat([].slice.call(arguments,2)) : [fn, delay]);
  };
})();
</script>

</body>
</html>
