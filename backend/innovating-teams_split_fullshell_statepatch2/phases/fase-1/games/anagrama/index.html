<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Fase 1 – Anagrama</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .letter-chip {
      display:flex; align-items:center; justify-content:center;
      border-radius:1rem; font-weight:600; cursor:pointer; user-select:none;
    }
    .letter-used { opacity:.25; pointer-events:none; }
    .answer-chip { cursor:pointer; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col">
  <!-- audios -->
  <!-- 1) incorrecta -->
  <audio id="audioWrong" src="training-program-incorrect1-88736.mp3" preload="auto"></audio>
  <!-- 2) correcta -->
  <audio id="audioCorrect" src="button_09-190435.mp3" preload="auto"></audio>
  <!-- 3) click / tocar letra -->
  <audio id="audioTap" src="computer-mouse-click-352734.mp3" preload="auto"></audio>

  <header class="w-full bg-slate-950/50 border-b border-white/5">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <div>
        <h1 class="text-xl md:text-2xl font-semibold">Fase 1 – Anagrama</h1>
        <p class="text-sm text-slate-200/70">Lee la descripción y ordena las letras.</p>
      </div>
      <div class="text-right">
        <p class="text-[0.6rem] uppercase text-slate-200/40">tiempo</p>
        <p id="timer" class="text-3xl font-mono text-emerald-300">00:00</p>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-6 space-y-6">
    <div class="bg-slate-900/40 border border-white/5 rounded-3xl p-6 space-y-6">
      <div class="flex items-center justify-between gap-3">
        <h2 class="text-lg font-semibold">Anagrama actual</h2>
        <span id="progress" class="text-sm text-slate-200/50">1 / 15</span>
      </div>

      <div>
        <p class="text-xs text-slate-200/40 uppercase mb-1">Descripción de la palabra:</p>
        <p id="description" class="text-base md:text-lg text-slate-50/90 leading-relaxed bg-slate-950/20 rounded-2xl px-4 py-3">
          ...
        </p>
      </div>

      <div>
        <p class="text-xs text-slate-200/50 mb-2">Letras disponibles</p>
        <div id="shuffledLetters" class="flex flex-wrap gap-3"></div>
      </div>

      <div>
        <p class="text-xs text-slate-200/50 mb-2">Respuesta del equipo (toca una letra para devolverla)</p>
        <div id="answerSlots" class="flex flex-wrap gap-2 min-h-12 bg-slate-950/30 rounded-2xl px-4 py-3 text-lg font-mono tracking-wide"></div>
      </div>

      <div id="feedback" class="hidden rounded-2xl px-4 py-3 text-sm font-medium"></div>

      <div class="flex gap-3">
        <button id="clearBtn" class="flex-1 bg-slate-950/40 rounded-2xl py-2">Borrar</button>
        <button id="nextBtn" class="flex-1 bg-emerald-400/90 text-slate-950 rounded-2xl py-2 font-semibold">Siguiente palabra</button>
      </div>

      <div id="doneBox" class="hidden bg-emerald-400/10 border border-emerald-400/40 rounded-2xl px-4 py-3">
        <p class="font-semibold">✅ Equipo completó todos los anagramas</p>
        <p class="text-sm text-emerald-50/70">Registra el tiempo y pasa a la siguiente actividad.</p>
      </div>
    </div>
  </main>

<script>
const WORDS = [
  "INNOVACION","EQUIPO","IDEA","CREATIVIDAD","PITCH","EMPATIA",
  "LIDERAZGO","PROYECTO","STARTUP","DESAFIO","SOLUCION","CLIENTE",
  "IMPACTO","TECNOLOGIA","COLABORAR"
];

const DESCRIPTIONS = {
  "INNOVACION": "Proceso de generar una propuesta distinta a lo habitual que resuelve el reto mejor que las soluciones existentes.",
  "EQUIPO": "Grupo de participantes que cooperan en esta fase y comparten responsabilidad sobre el puntaje.",
  "IDEA": "Formulación corta de la solución: qué harás, para quién y por qué serviría.",
  "CREATIVIDAD": "Habilidad del grupo para producir varias opciones diferentes antes de elegir la mejor.",
  "PITCH": "Explicación de 30 a 90 segundos que busca convencer a un jurado o facilitador.",
  "EMPATIA": "Paso en el que el equipo se pone en el lugar del usuario para entender su problema real.",
  "LIDERAZGO": "Rol de quien ordena el trabajo, reparte tareas y toma la decisión final cuando hay dudas.",
  "PROYECTO": "Trabajo estructurado con objetivo, tareas y responsable que nace de la idea que eligieron.",
  "STARTUP": "Emprendimiento joven, de base innovadora, que quiere crecer rápido y probar el mercado.",
  "DESAFIO": "Problema o reto que les plantea la fase y que deben resolver antes de avanzar.",
  "SOLUCION": "Propuesta concreta del equipo para resolver el desafío, ya pensada para el usuario.",
  "CLIENTE": "Persona u organización para la que se diseña la solución y que se quiere satisfacer.",
  "IMPACTO": "Cambio medible o beneficio claro que la solución generará en el usuario o contexto.",
  "TECNOLOGIA": "Recurso o herramienta digital que ayuda a implementar la solución (app, web, IA, etc.).",
  "COLABORAR": "Trabajar en conjunto, escuchando y aportando, para llegar más rápido o a una mejor respuesta."
};

const shuffledLettersEl = document.getElementById("shuffledLetters");
const answerSlotsEl = document.getElementById("answerSlots");
const feedbackEl = document.getElementById("feedback");
const progressEl = document.getElementById("progress");
const doneBoxEl = document.getElementById("doneBox");
const clearBtn = document.getElementById("clearBtn");
const nextBtn = document.getElementById("nextBtn");
const timerEl = document.getElementById("timer");
const descriptionEl = document.getElementById("description");

const audioWrong = document.getElementById("audioWrong");
const audioCorrect = document.getElementById("audioCorrect");
const audioTap = document.getElementById("audioTap");

let currentIndex = 0;
let currentWord = "";
let currentLetters = [];
let answerEntries = [];
let usedIndices = [];
let solved = new Set();
let seconds = 0;
let timer = null;

function startTimer(){
  if (timer) return;
  timer = setInterval(()=>{
    seconds++;
    const mm = String(Math.floor(seconds/60)).padStart(2,"0");
    const ss = String(seconds%60).padStart(2,"0");
    timerEl.textContent = mm + ":" + ss;
  },1000);
}

function shuffleArray(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function loadWord(index){
  currentWord = WORDS[index];
  descriptionEl.textContent = DESCRIPTIONS[currentWord] || "Descripción no disponible.";

  let shuffled;
  do {
    shuffled = shuffleArray(currentWord.split(""));
  } while (shuffled.join("") === currentWord && currentWord.length > 1);

  currentLetters = shuffled;
  answerEntries = [];
  usedIndices = Array(currentLetters.length).fill(false);

  shuffledLettersEl.innerHTML = "";
  currentLetters.forEach((letter, i)=>{
    const btn = document.createElement("button");
    btn.textContent = letter;
    btn.className = "letter-chip w-14 h-14 md:w-16 md:h-16 bg-slate-800/80 hover:bg-slate-700 text-lg";
    btn.dataset.index = i;
    btn.addEventListener("click", onLetterClick);
    shuffledLettersEl.appendChild(btn);
  });

  answerSlotsEl.innerHTML = "";
  feedbackEl.classList.add("hidden");
  progressEl.textContent = (index+1) + " / " + WORDS.length;
}

function playTap(){ if (audioTap){ audioTap.currentTime = 0; audioTap.play().catch(()=>{}); } }
function playCorrect(){ if (audioCorrect){ audioCorrect.currentTime = 0; audioCorrect.play().catch(()=>{}); } }
function playWrong(){ if (audioWrong){ audioWrong.currentTime = 0; audioWrong.play().catch(()=>{}); } }

function onLetterClick(e){
  startTimer();
  const idx = parseInt(e.currentTarget.dataset.index);
  if (usedIndices[idx]) return;
  usedIndices[idx] = true;
  e.currentTarget.classList.add("letter-used");

  const letter = currentLetters[idx];
  answerEntries.push({ letter, sourceIndex: idx });
  renderAnswer();
  playTap();
  checkIfComplete();
}

function renderAnswer(){
  answerSlotsEl.innerHTML = "";
  answerEntries.forEach((entry, pos)=>{
    const span = document.createElement("span");
    span.textContent = entry.letter;
    span.className = "answer-chip px-3 py-1 bg-slate-800/80 rounded-xl";
    span.dataset.pos = pos;
    span.addEventListener("click", onAnswerClick);
    answerSlotsEl.appendChild(span);
  });
}

function onAnswerClick(e){
  const pos = parseInt(e.currentTarget.dataset.pos);
  const entry = answerEntries[pos];

  usedIndices[entry.sourceIndex] = false;
  const btn = shuffledLettersEl.querySelector(`[data-index="${entry.sourceIndex}"]`);
  if (btn) btn.classList.remove("letter-used");

  answerEntries.splice(pos, 1);
  renderAnswer();
  playTap();
  feedbackEl.classList.add("hidden");
}

function checkIfComplete(){
  const currentAnswer = answerEntries.map(e => e.letter).join("");
  if (currentAnswer === currentWord){
    showFeedback("✅ Correcto: " + currentWord, "ok");
    playCorrect();
    solved.add(currentWord);
    if (solved.size === WORDS.length){
      doneBoxEl.classList.remove("hidden");
      clearInterval(timer); timer = null;
    } else {
      setTimeout(()=>goNextWord(), 700);
    }
  } else if (currentAnswer.length === currentWord.length){
    showFeedback("❌ No es esa, revisa la descripción", "error");
    playWrong();
  }
}

function showFeedback(msg, type){
  feedbackEl.textContent = msg;
  feedbackEl.classList.remove("hidden");
  if (type === "ok"){
    feedbackEl.className = "rounded-2xl px-4 py-3 text-sm font-medium bg-emerald-400/10 text-emerald-100 border border-emerald-400/40";
  } else {
    feedbackEl.className = "rounded-2xl px-4 py-3 text-sm font-medium bg-rose-400/5 text-rose-100 border border-rose-400/40";
  }
}

clearBtn.addEventListener("click", ()=>{
  answerEntries = [];
  renderAnswer();
  usedIndices = usedIndices.map(()=>false);
  shuffledLettersEl.querySelectorAll("button").forEach(btn=>btn.classList.remove("letter-used"));
  feedbackEl.classList.add("hidden");
  playTap();
});

function goNextWord(){
  currentIndex++;
  if (currentIndex >= WORDS.length){
    currentIndex = WORDS.length - 1;
    return;
  }
  loadWord(currentIndex);
}

nextBtn.addEventListener("click", ()=>{
  goNextWord();
  playTap();
});

loadWord(currentIndex);
</script>
</body>
</html>
