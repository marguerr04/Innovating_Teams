

services:
  # 1. BASE DE DATOS (PostgreSQL)
  db:
    image: postgres:alpine
    container_name: mi_bd_postgres
    
    # Variables de entorno de la BD (tomadas de .env)
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      # CLAVE: Mapear el directorio completo con scripts de inicialización
      - ./setup_bd:/docker-entrypoint-initdb.d
    restart: always

  # 2. BACKEND (Django)
  backend:
    # Contexto de construcción (donde está manage.py y Dockerfile)
    build:
      context: ./backend/misionemprende 
      dockerfile: Dockerfile 
    container_name: mi_backend_django
    
    # Se asegura de que el servicio 'db' intente iniciar
    depends_on:
      - db 
    
    # 🛑 COMANDO CLAVE CORREGIDO: Espera a que la BD esté lista y luego inicia el servidor.
    # Eliminamos 'migrate' porque el .sql ya crea el esquema y los datos.
    command: >
      sh -c "wait-for-it.sh db:5432 --timeout=60 --strict -- \
             python reset_password_after_dump.py && \
             python manage.py runserver 0.0.0.0:8000"
    
    volumes:
      - ./backend/misionemprende:/app
    environment:
      DB_HOST: db 
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DJANGO_DEBUG}
    ports:
      - "8000:8000"
    restart: always

  # 3. FRONTEND (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mi_frontend_app
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: always

# Definición de volúmenes para persistencia de la BD
volumes:
  postgres_data: